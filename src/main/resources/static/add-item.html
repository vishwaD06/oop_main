<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Item — ShareSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar"><div class="nav-brand"><a href="index.html"><span class="logo-icon">🌐</span><span class="logo-text">ShareSphere</span></a></div>
<div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="items.html">Browse</a></div>
<div class="nav-actions" id="navActions"></div></nav>
<div class="form-page">
  <div class="form-card">
    <h2>📦 List a New Item</h2>
    <p>Fill in the details to list your item on ShareSphere</p>
    <div id="formError" class="alert alert-error hidden"></div>
    <form id="addItemForm">
      <div class="form-row">
        <div class="form-group"><label>Item Name *</label><input type="text" id="iName" class="form-control" placeholder="e.g. Casio FX-991CW Calculator" required></div>
        <div class="form-group"><label>Category *</label><select id="iCategory" class="form-control" required><option value="">Select category...</option></select></div>
      </div>
      <div class="form-group"><label>Description</label><textarea id="iDesc" class="form-control" rows="3" placeholder="Describe the item, its condition and any notes..."></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Condition *</label><select id="iCondition" class="form-control" required><option value="">Select...</option><option>New</option><option>Like New</option><option>Good</option><option>Fair</option></select></div>
        <div class="form-group"><label>Listing Type *</label><select id="iType" class="form-control" required onchange="togglePriceFields()"><option value="">Select...</option><option value="SELL">For Sale</option><option value="RENT">For Rent</option><option value="LEND">For Lending (Free)</option><option value="SELL_AND_RENT">Sale &amp; Rent</option></select></div>
      </div>
      <div class="form-row" id="priceFields">
        <div class="form-group"><label>Sale Price (₹)</label><input type="number" id="iPrice" class="form-control" placeholder="0.00" min="0"></div>
        <div class="form-group"><label>Rental Price/Day (₹)</label><input type="number" id="iRental" class="form-control" placeholder="0.00" min="0"></div>
        <div class="form-group"><label>Security Deposit (₹)</label><input type="number" id="iDeposit" class="form-control" placeholder="0.00" min="0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Quantity</label><input type="number" id="iQty" class="form-control" value="1" min="1"></div>
        <div class="form-group"><label>Location / Area</label><input type="text" id="iLocation" class="form-control" placeholder="e.g. Hostel A, Block C"></div>
      </div>
      <div class="form-group"><label>🏫 Campus Handover Spot</label>
        <select id="iLandmark" class="form-control"><option value="">Select verified landmark (optional)...</option></select>
      </div>
      <div class="form-group" id="smartPricingBox" style="background:#1a1f3a;border:1px solid #3a3fba;padding:16px;border-radius:12px;display:none;">
        <h4 style="color:#8a8fff;margin:0 0 8px;">💡 Smart Pricing Suggestion</h4>
        <div id="smartPricingResult" style="font-size:0.9em;color:#ccc;"></div>
        <button type="button" class="btn btn-ghost btn-sm" onclick="applySmartPricing()" style="margin-top:8px;">✅ Apply Suggested Prices</button>
      </div>
      <div style="border-top:1px solid #333;padding-top:16px;margin-top:16px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="iBundleCheck" onchange="toggleBundleFields()">
          <strong>📦 Graduation Clearance Bundle</strong> — Sell multiple items together at a discount
        </label>
        <div id="bundleFields" style="display:none;margin-top:12px;">
          <div class="form-group"><label>Items in Bundle (one per line)</label>
            <textarea id="iBundleItems" class="form-control" rows="3" placeholder="Study Table (₹2500)&#10;Electric Kettle (₹500)&#10;Desk Lamp (₹300)"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Original Total Value (₹)</label><input type="number" id="iOriginalValue" class="form-control" placeholder="3300"></div>
            <div class="form-group"><label>Bundle Savings (₹)</label><input type="number" id="iBundleSavings" class="form-control" placeholder="800"></div>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Item Image</label>
        <div class="file-upload-zone" id="uploadZone" onclick="document.getElementById('imageFile').click()">
          <span>📷 Click to upload image</span>
          <input type="file" id="imageFile" accept="image/*" class="hidden" onchange="previewImage(this)">
          <img id="imagePreview" class="hidden" style="max-width:100%;border-radius:8px;margin-top:10px;">
        </div>
      </div>
      <div class="form-actions">
        <a href="my-listings.html" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">🚀 List Item</button>
      </div>
    </form>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="js/api.js"></script><script src="js/app.js"></script>
<script>
requireAuth();
loadCategories();
loadLandmarks();
async function loadCategories() {
  const cats = await API.get('/api/categories');
  const sel = document.getElementById('iCategory');
  cats.forEach(c => sel.innerHTML += `<option value="${c.id}">${c.icon} ${c.name}</option>`);
}
async function loadLandmarks() {
  try {
    const landmarks = await API.get('/api/landmarks');
    const sel = document.getElementById('iLandmark');
    landmarks.forEach(l => sel.innerHTML += `<option value="${l}">${l}</option>`);
  } catch(e) {}
}
function togglePriceFields() {
  const t = document.getElementById('iType').value;
  document.getElementById('priceFields').style.display = (t==='LEND') ? 'none' : 'flex';
}
function toggleBundleFields() {
  document.getElementById('bundleFields').style.display = document.getElementById('iBundleCheck').checked ? 'block' : 'none';
}
let _smartPricing = null;
async function fetchSmartPricing() {
  const name = document.getElementById('iName').value;
  const catId = document.getElementById('iCategory').value;
  const condition = document.getElementById('iCondition').value;
  if (!name || !condition) return;
  try {
    _smartPricing = await API.post('/api/smart/pricing', { name, categoryId: catId ? +catId : null, condition });
    if (_smartPricing && _smartPricing.suggestedSellPrice) {
      const box = document.getElementById('smartPricingBox');
      box.style.display = 'block';
      document.getElementById('smartPricingResult').innerHTML =
        `<div>📊 <strong>Demand:</strong> ${_smartPricing.demandLevel} ${_smartPricing.surgeMultiplier > 1 ? '('+_smartPricing.spikeReason+')' : ''}</div>` +
        `<div>💰 <strong>Sell Price:</strong> ₹${_smartPricing.suggestedSellPrice} | <strong>Rental/Day:</strong> ₹${_smartPricing.suggestedRentalPerDay} | <strong>Deposit:</strong> ₹${_smartPricing.suggestedSecurityDeposit}</div>` +
        `<div style="margin-top:4px;font-size:0.85em;opacity:0.8;">${_smartPricing.explanation}</div>`;
    }
  } catch(e) {}
}
function applySmartPricing() {
  if (!_smartPricing) return;
  document.getElementById('iPrice').value = _smartPricing.suggestedSellPrice;
  document.getElementById('iRental').value = _smartPricing.suggestedRentalPerDay;
  document.getElementById('iDeposit').value = _smartPricing.suggestedSecurityDeposit;
  showToast('Smart prices applied! 💡', 'success');
}
document.getElementById('iCondition').addEventListener('change', fetchSmartPricing);
document.getElementById('iName').addEventListener('blur', fetchSmartPricing);
document.getElementById('iCategory').addEventListener('change', fetchSmartPricing);
function previewImage(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => { const img=document.getElementById('imagePreview'); img.src=e.target.result; img.classList.remove('hidden'); };
    reader.readAsDataURL(input.files[0]);
  }
}
document.getElementById('addItemForm').addEventListener('submit', async e => {
  e.preventDefault();
  const data = {
    name: document.getElementById('iName').value,
    description: document.getElementById('iDesc').value,
    categoryId: +document.getElementById('iCategory').value,
    condition: document.getElementById('iCondition').value,
    listingType: document.getElementById('iType').value,
    price: document.getElementById('iPrice').value || null,
    rentalPricePerDay: document.getElementById('iRental').value || null,
    securityDeposit: document.getElementById('iDeposit').value || null,
    availableQuantity: +document.getElementById('iQty').value,
    location: document.getElementById('iLocation').value,
    landmark: document.getElementById('iLandmark').value || null,
    isBundle: document.getElementById('iBundleCheck').checked,
    bundleItems: document.getElementById('iBundleItems').value || null,
    originalTotalValue: document.getElementById('iOriginalValue').value || null,
    bundleSavings: document.getElementById('iBundleSavings').value || null
  };
  try {
    const moderation = await API.post('/api/smart/moderation/check', {
      name: data.name,
      description: data.description,
      location: data.location
    }).catch(() => ({ approved: true }));
    if (moderation && moderation.approved === false) {
      throw new Error(moderation.message || 'Listing blocked by campus moderation');
    }
    const item = await API.post('/api/items', data);
    const imageFile = document.getElementById('imageFile').files[0];
    if (imageFile) {
      const fd = new FormData(); fd.append('file', imageFile);
      await API.uploadFile(`/api/items/${item.id||1}/images`, fd);
    }
    showToast('Item listed successfully! 🎉', 'success');
    setTimeout(() => window.location='my-listings.html', 1500);
  } catch(e) { document.getElementById('formError').textContent = e.message; document.getElementById('formError').classList.remove('hidden'); }
});
</script>
</body></html>
